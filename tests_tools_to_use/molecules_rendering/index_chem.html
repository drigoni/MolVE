    // Initialize the 2D viewer
    // const viewer = new ChemDoodle.ViewerCanvas('chemdoodle', 400, 400);
    const viewer = new ChemDoodle.TransformCanvas('chemdoodle', 400, 400);
    viewer.styles.atoms_useJMOLColors = true;
    viewer.styles.bonds_width_2D = .6;
    viewer.styles.bonds_saturationWidthAbs_2D = 2.6;
    viewer.styles.bonds_hashSpacing_2D = 2.5;
    viewer.styles.atoms_font_size_2D = 5;
    viewer.styles.atoms_font_families_2D = ['Helvetica', 'Arial', 'sans-serif'];
    viewer.styles.atoms_displayTerminalCarbonLabels_2D = true;

    // Parse and load the SDF data
    const molecule = ChemDoodle.readMOL(sdfData);
    // const molecule = ChemDoodle.readMOL(caffeineMolFile);
    molecule.scaleToAverageBondLength(14.4);
    viewer.loadMolecule(molecule);
    viewer.styles.scale = 2;
    viewer.repaint();
