# Production docker-compose configuration

services:
  app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"     # Expose only the main application port
      - "443:443"       # Port for HTTPS
    environment:
      - SDF_MAX_UPLOAD_MB=100
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/molecular_app
      - PGDATABASE=molecular_app
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=password
      - PYTHONPATH=/app
      - VIRTUAL_ENV=/venv
      - PATH=/venv/bin:/usr/local/bin:/usr/bin:/bin
    # In production we typically do not bind-mount source directories
    # to keep the image immutable and self-contained.
    depends_on:
      db:
        condition: service_healthy
      python-service:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped
    # Use the image default CMD (initial_configs/start.sh),
    # which waits for DB, generates certs if needed, then runs npm start.

  python-service:
    build:
      context: ./services/python-service
      dockerfile: Dockerfile
    # No external port binding in production; only internal network access
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app_network
    restart: unless-stopped
  
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=molecular_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    # No external port binding in production
    volumes:
      - ./services/db/docker_storages/postgres:/var/lib/postgresql/data
      - ./services/db/init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d molecular_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
